spring:
  # 只修改这一项即可切换环境：dev=开发配置，deploy=部署配置。
  profiles:
    active: dev
  application:
    # 应用名称用于日志、监控和 Spring Boot 服务识别。
    name: mes-backend
  jpa:
    properties:
      hibernate:
        # 开发阶段保留格式化 SQL，便于学习和排查数据库问题。
        format_sql: true

server:
  # 两套环境都使用同一个 API 端口，反向代理和前端无需跟随环境切换。
  port: ${SERVER_PORT:8080}

logging:
  # 项目日志保持 INFO，SQL 和 Spring 框架日志降低噪声。
  level:
    com.example.mes: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO

mes:
  auth:
    # 权限服务类型由环境配置覆盖，local 用于本地数据库用户，remote 用于外部权限服务。
    provider: ${AUTH_PROVIDER:local}
    external:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8090}
      login-path: ${AUTH_SERVICE_LOGIN_PATH:/api/permissions/login}
  realtime:
    centrifugo:
      # JWT 和 API Key 必须通过环境变量覆盖，禁止提交生产密钥。
      api-key: ${CENTRIFUGO_API_KEY:mes-realtime-api-key}
      token-secret: ${CENTRIFUGO_TOKEN_SECRET:mes-learning-dev-secret-change-me}
  netty:
    # Netty 设备遥测服务端口。
    port: ${NETTY_PORT:9000}
  mq:
    # 生产事件队列名称由代码和部署配置共同使用。
    production-events: mes.production.events
