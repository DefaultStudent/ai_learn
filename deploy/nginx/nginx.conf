events {}
http {
  # Spring Boot 在宿主机运行，Docker Desktop 通过 host.docker.internal 访问宿主机。
  upstream mes_api { server host.docker.internal:8080; }
  # 前端和 Nginx 在同一个 Compose 网络内，使用服务名互相发现。
  upstream mes_frontend { server frontend:5173; }
  upstream centrifugo { server centrifugo:8000; }
  server {
    listen 80;
    location /api/ { proxy_pass http://mes_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /connection/ { proxy_pass http://centrifugo; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location / { proxy_pass http://mes_frontend; proxy_set_header Host $host; }
  }
}
